name: qwen3-8-27b
hf_id: Qwen/Qwen3.8-27B
image: nvcr.io/nvidia/vllm:26.06-py3
entrypoint: serve-prefix
shm_size: 32g
est_size_gb: 56           # actual HF blob sum: 51.8 GiB (2026-08-28)
health_timeout_secs: 900
# vllm_args: operator-approved (2026-08-28) starting point = qwen3-coder-next-fp8
# profile. Tune after first live swap if the qwen3_5 arch objects.
vllm_args:
  max-model-len: 65536
  gpu-memory-utilization: 0.90
  enable-prefix-caching: true
  enable-auto-tool-choice: true
  tool-call-parser: qwen3_coder
  max-num-seqs: 4
